import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// The APK carries the same version as the server it opens (package.json), and the CI run number as its
// versionCode so every build installs over the last one.
def flixVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
def keystore = System.getenv('FLIX_KEYSTORE_FILE')

android {
    namespace 'com.viberific.flix'
    // compileSdk is one setting for the whole project, so it is on 36 for both builds: Play refuses a bundle
    // that targets under 36, and compiling against 36 is what makes that target reachable. It does not change
    // behaviour on its own -- targetSdk is what does that, and it stays 35 below except for the Play flavor.
    compileSdk 36

    defaultConfig {
        applicationId 'com.viberific.flix'
        minSdk 23
        // The sideload APK ships to TVs and phones today on 35. Android 16's behaviour changes (mandatory
        // edge-to-edge, and no opt-out) are not needed for it, so it stays where it is known to work.
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName flixVersion
    }

    buildFeatures {
        buildConfig true
    }

    // Two builds of the same app. sideload: the APK on the GitHub release, which installs its own updates from there
    // (Updater). play: the bundle for Google Play's internal testing track, which Play updates; Android Auto only lists
    // a Car App Library app that came from Play, so this is the one for the car. src/play/ takes the self-updating out.
    flavorDimensions 'store'
    productFlavors {
        sideload {
            dimension 'store'
            buildConfigField 'boolean', 'SELF_UPDATE', 'true'
        }
        play {
            dimension 'store'
            buildConfigField 'boolean', 'SELF_UPDATE', 'false'
            // Play's automatic protection refuses a bundle whose minSdk is below 24, so only the store
            // build is raised. sideload inherits defaultConfig's 23 above and still installs on the
            // older Android TV boxes; minSdk 24 is Android 7.0, which Play will not serve anyway.
            minSdk 24
            // Play also refuses a bundle that targets under API 36 (android 16). Only this build moves: the
            // screen is a full-screen WebView that pads itself from the window insets (MainActivity), so the
            // edge-to-edge that 36 makes mandatory is already how it behaves.
            targetSdk 36
        }
    }

    signingConfigs {
        // A fixed key (from repository secrets in CI) lets each new APK install as an update. Without one the
        // build is signed with a throwaway debug key, and the old app has to be uninstalled before a new one goes on.
        if (keystore) {
            release {
                storeFile file(keystore)
                storeType 'PKCS12'
                storePassword System.getenv('FLIX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FLIX_KEY_ALIAS')
                keyPassword System.getenv('FLIX_KEY_PASSWORD') ?: System.getenv('FLIX_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Flix on the car screen (Android Auto), see the car/ package. The phone and TV app does not use these.
    implementation 'androidx.car.app:app:1.4.0'
    implementation 'androidx.car.app:app-projected:1.4.0'
}
