name: Build Android / TV app

# Flix as an installable APK for Android TV (and phones): a thin full-screen
# shell around the web app (android/), so it is exactly what the server serves.
# Every run uploads the APK as a build artifact; a push to main also attaches it
# to the GitHub release for that version (v<package.json version>), so it can be
# downloaded straight onto a TV (e.g. with the Downloader app) or pushed with adb.
#
# The installed app checks the latest release on launch and installs a newer APK itself (Updater.java);
# that only works when every build is signed with the same key, so set the secrets below.
#
# Signing: set the repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (and ANDROID_KEY_PASSWORD if it
# differs) so every build is signed with the same key and installs as an update.
# Without them the APK is signed with a throwaway debug key: it installs fine,
# but the previous version has to be uninstalled first.
#
# Google Play (internal testing): with the signing secrets set, every run also builds
# the Play bundle (flix-play-<version>.aab, an artifact). A push to main uploads it to
# the internal testing track when PLAY_SERVICE_ACCOUNT_JSON (a service account's JSON
# key with release rights in Play Console) is set. Android Auto lists the car screen
# only from a Play install; see docs/play-internal-testing.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/flix.jks"
            echo "FLIX_KEYSTORE_FILE=$RUNNER_TEMP/flix.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key, so installing it over an earlier build needs an uninstall first."
          fi

      - name: Build the APK
        env:
          FLIX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLIX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLIX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon assembleSideloadRelease
          version="$(node -p "require('./package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/sideload/release/app-sideload-release.apk "flix-$version.apk"

      # Play refuses a bundle signed with a debug key, so there is no Play bundle without the signing secrets.
      - name: Build the Play bundle
        if: env.FLIX_KEYSTORE_FILE != ''
        env:
          FLIX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLIX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLIX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon bundlePlayRelease
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab "flix-play-$VERSION.aab"

      - uses: actions/upload-artifact@v4
        if: env.FLIX_KEYSTORE_FILE != ''
        with:
          name: flix-play-${{ env.VERSION }}-aab
          path: flix-play-${{ env.VERSION }}.aab
          if-no-files-found: error

      # The very first bundle has to be uploaded by hand in Play Console (the API cannot create the app); from then on
      # every push to main lands on the internal testing track, and the testers' phones update from Play.
      - name: Upload to Google Play (internal testing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.FLIX_KEYSTORE_FILE != '' && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.viberific.flix
          releaseFiles: flix-play-${{ env.VERSION }}.aab
          releaseName: ${{ env.VERSION }}
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        with:
          name: flix-${{ env.VERSION }}-apk
          path: flix-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Flix $VERSION" --notes "Flix $VERSION. Install \`flix-$VERSION.apk\` on an Android TV or phone."
          fi
          # The key this APK was actually signed with, as the installed app sees its own: the two must match or the
          # installer refuses the update, so the app says that plainly instead of trying and failing in silence.
          cert="$(keytool -printcert -jarfile "flix-$VERSION.apk" | awk '/SHA256:/ { print $2; exit }' | tr -d ':' | tr 'A-F' 'a-f')"
          # A debug-signed APK is signed with a key the runner makes up on the spot, so it can never install over an
          # earlier build. Saying versionCode 0 keeps the app from offering an update that cannot land.
          code="$GITHUB_RUN_NUMBER"
          if [ -z "$FLIX_KEYSTORE_FILE" ]; then
            code=0
            echo "::warning::This APK is debug-signed, so it cannot install over an earlier Flix. Not offering it as an in-app update; set ANDROID_KEYSTORE_BASE64 to make self-updates work."
          fi
          # The installed app reads this to learn whether the APK on the release is newer than itself.
          echo "{\"versionCode\": $code, \"versionName\": \"$VERSION\", \"apk\": \"flix-$VERSION.apk\", \"cert\": \"$cert\"}" > update.json
          cat update.json
          gh release upload "$tag" "flix-$VERSION.apk" update.json --clobber
