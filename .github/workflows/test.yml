name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast checks: type check, parsing, season rules, auth, health. Only ffmpeg is installed, for the tests that turn a
  # subtitle file into WebVTT (as the server does).
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  # The whole pipeline: mock BTN, a tracker and seeder, real qBittorrent and ffmpeg.
  # Not required to pass yet: it has not been run in CI before, so a red here means "look", not "broken".
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg qbittorrent-nox
      - run: npm ci
      - run: npm test
