<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A television reports its viewport in density-independent pixels, which says nothing about its real size: a 1080p
     set reports about 960x540 and a 4K one about 1920x1080, so the app's own breakpoints pick the phone layout and
     stretch it across a 65-inch panel, making every control an enormous slab. Laying the page out at a fixed 1280 CSS
     pixels instead, and letting the panel fit that to its own width, keeps the desktop proportions at any screen size;
     a phone is a browser and never gets this meta, so it is untouched.
     Deliberately no initial-scale: with one, a WebView draws 1280 CSS pixels at their own size instead of fitting them
     to the screen, which is what left a television's UI huge with half of it off-screen. -->
<script>
(function () {
  if (!/Android TV FlixApp/.test(navigator.userAgent)) return
  var m = document.querySelector('meta[name="viewport"]')
  if (m) m.setAttribute('content', 'width=1280')
})()
</script>
<title>Flix</title>
<meta name="theme-color" content="#090b0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- use-credentials: the manifest is fetched without cookies by default, which Umbrel's sign-in turns into a redirect, and Chrome then says "this app cannot be installed". -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top"></header>
<main id="app"><div class="boot" id="boot"><div class="boot-mark"></div></div></main>
<script src="/vendor/hls.min.js"></script>
<script type="module" src="/app.js"></script>
<script>
// If the app script never starts (old browser, blocked or broken download), say so instead of showing a blank page.
setTimeout(function () {
  if (window.__flixBooted) return
  var b = document.getElementById('boot')
  if (b) b.innerHTML = '<div class="boot-mark"></div><p>Flix didn\u2019t start.</p><p class="dim">Check that the Flix server is running, then reload. If it keeps happening, try another browser.</p><button class="btn primary" onclick="location.reload()">Reload</button>'
}, 10000)
</script>
</body>
</html>
